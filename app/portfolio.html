<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sayGM — Crypto Portfolio</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header>
    <div class="logo"><i class="fa-solid fa-cube"></i> sayGM</div>

    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="hamburger" aria-label="Toggle menu">
      <i class="fa-solid fa-bars"></i>
    </label>

    <nav>
      <ul>
        <li><a href="/index.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="/index.html#about"><i class="fa-solid fa-user"></i> About</a></li>
        <li><a href="/app/service.html"><i class="fa-solid fa-screwdriver-wrench"></i> Service</a></li>
        <li><a href="/app/portfolio.html" class="active-flash"><i class="fa-solid fa-chart-pie"></i> Portfolio</a></li>
        <li><a href="/index.html#blog"><i class="fa-solid fa-pen-nib"></i> Blog</a></li>
        <li><a href="/index.html#contact"><i class="fa-solid fa-envelope"></i> Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="chart-section" id="portfolio">
    <h1><i class="fa-solid fa-chart-pie"></i> Crypto Portfolio</h1>
    <p>Digital asset distribution by value allocation</p>

    <div class="portfolio-wrap">
      <canvas id="cryptoChart"></canvas>
      <div class="allocations">
        <ul>
          <li><span class="dot" style="background:#ff6384"></span><strong>ETH</strong><span class="pct">63.93%</span><span class="val">$754.75</span></li>
          <li><span class="dot" style="background:#36a2eb"></span><strong>USDT</strong><span class="pct">13.59%</span><span class="val">$160.44</span></li>
          <li><span class="dot" style="background:#ffce56"></span><strong>NEIRO</strong><span class="pct">11.73%</span><span class="val">$138.52</span></li>
          <li><span class="dot" style="background:#8e44ad"></span><strong>JUP</strong><span class="pct">6.40%</span><span class="val">$75.61</span></li>
          <li><span class="dot" style="background:#00b894"></span><strong>WCT</strong><span class="pct">4.03%</span><span class="val">$47.52</span></li>
          <li><span class="dot" style="background:#636e72"></span><strong>OTHERS</strong><span class="pct">0.32%</span><span class="val">$3.73</span></li>
        </ul>
      </div>
    </div>

  <footer>
    <p>&copy; 2025 sayGM. <i class="fa-solid fa-lock"></i> Privacy</p>
  </footer>

  <script src="/js/chartx.js"></script>
  <script>
    const navToggle = document.getElementById('nav-toggle');
    document.querySelectorAll('nav a').forEach(link => {
      link.addEventListener('click', () => {
        if (navToggle) navToggle.checked = false;
      });
    });
  </script>
</body>
</html>
